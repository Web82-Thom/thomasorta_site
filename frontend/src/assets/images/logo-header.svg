<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">Logo ORTA</title>
  <desc id="logoDesc">Logo Thomas ORTA Solutions Numeriques Web et Mobile optimise pour fond sombre.</desc>

  <defs>
